name: Release du thème G2RD FSE

# Déclenchement : tag de version (ex. v1.3.0) ou manuel
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (ex. 1.3.0)'
        required: true
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # ── Checkout ─────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── Node.js & Build des blocs ─────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Installer les dépendances npm
        run: npm ci --ignore-scripts

      - name: Compiler tous les blocs
        run: npm run build

      # ── Déterminer la version ─────────────────────────────────────────────
      - name: Déterminer la version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            # Extraire depuis le tag (supprime le 'v' préfixe)
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag=v${VERSION}" >> $GITHUB_OUTPUT

      # ── Créer le ZIP de production ────────────────────────────────────────
      - name: Créer le ZIP de production
        run: |
          mkdir -p dist/g2rd-theme

          # Copier les fichiers dans le dossier g2rd-theme/ (requis par WordPress)
          rsync -a \
            --exclude=".git" \
            --exclude=".github" \
            --exclude="node_modules" \
            --exclude="vendor" \
            --exclude="dist" \
            --exclude="blocks/*/src" \
            --exclude="blocks/*/node_modules" \
            --exclude="blocks/*/package.json" \
            --exclude="blocks/*/package-lock.json" \
            --exclude="*.sh" \
            --exclude="*.ps1" \
            --exclude="phpcs*.xml*" \
            --exclude="composer.json" \
            --exclude="composer.lock" \
            --exclude="package.json" \
            --exclude="package-lock.json" \
            --exclude="*.log" \
            --exclude=".claude" \
            --exclude="docs" \
            --exclude="CLAUDE.md" \
            . dist/g2rd-theme/

          # Zipper le dossier avec le wrapper — WordPress l'installera sous g2rd-theme/
          cd dist
          zip -r g2rd-theme.zip g2rd-theme/
          cd ..

          echo "Taille ZIP : $(du -sh dist/g2rd-theme.zip | cut -f1)"

      # ── Créer la release GitHub ───────────────────────────────────────────
      - name: Créer la release GitHub
        id: github_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "G2RD Theme FSE v${{ steps.version.outputs.version }}"
          files: dist/g2rd-theme.zip
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── Notifier g2rd.fr (mise à jour boutique FluentCart) ────────────────
      - name: Notifier g2rd.fr de la nouvelle release
        if: success()
        run: |
          DOWNLOAD_URL="${{ steps.github_release.outputs.assets[0].browser_download_url }}"

          if [ -z "$DOWNLOAD_URL" ]; then
            DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.tag }}/g2rd-theme.zip"
          fi

          VERSION="${{ steps.version.outputs.version }}"

          # Récupérer les notes de release depuis l'API GitHub
          RELEASE_BODY=$(curl -s \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/${{ steps.version.outputs.tag }}" \
            | jq -r '.body // ""')

          # Construire le payload JSON avec le changelog
          PAYLOAD=$(jq -n \
            --arg version "$VERSION" \
            --arg download_url "$DOWNLOAD_URL" \
            --arg changelog "$RELEASE_BODY" \
            '{version: $version, download_url: $download_url, changelog: $changelog}')

          # Calculer la signature HMAC-SHA256
          SIGNATURE="sha256=$(echo -n "${PAYLOAD}" | openssl dgst -sha256 -hmac "${{ secrets.G2RD_WEBHOOK_SECRET }}" | awk '{print $2}')"

          # Appeler l'endpoint LicenseServer sur g2rd.fr
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST \
            -H "Content-Type: application/json" \
            -H "X-G2RD-Signature: ${SIGNATURE}" \
            -d "${PAYLOAD}" \
            "https://g2rd.fr/wp-json/g2rd-license/v1/release-webhook")

          echo "HTTP Status: ${HTTP_STATUS}"

          if [ "$HTTP_STATUS" != "200" ]; then
            echo "⚠️ Webhook g2rd.fr a retourné HTTP ${HTTP_STATUS} — vérifier manuellement."
            exit 0
          fi

          echo "✅ g2rd.fr notifié de la release v${VERSION} avec changelog"
