name: Release du thème G2RD FSE

# Déclenchement : tag de version (ex. v1.6.9.5) ou manuel
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (ex. 1.6.9.5)'
        required: true
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wp_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Déterminer la version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag=v${VERSION}" >> $GITHUB_OUTPUT

      - name: Vérifier l'alignement des versions (style.css, package.json, readme.txt, composer)
        run: bash tools/verify-release-version.sh "${{ steps.version.outputs.version }}"

      - name: Vérifier cohérence tag Git ↔ version (push tag uniquement)
        if: github.event_name == 'push'
        run: |
          TAG="${GITHUB_REF_NAME}"
          EXPECTED="v${{ steps.version.outputs.version }}"
          if [ "$TAG" != "$EXPECTED" ]; then
            echo "ERREUR: le tag poussé ($TAG) ne correspond pas à la version dérivée ($EXPECTED)"
            exit 1
          fi
          echo "OK: tag $TAG aligné avec la version ${{ steps.version.outputs.version }}"

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer
          coverage: none

      - name: Composer install (prod uniquement — aligné avec le ZIP sans vendor)
        run: composer install --no-interaction --prefer-dist --no-dev

      - name: Composer audit
        run: composer audit --no-interaction

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Installer les dépendances npm
        run: npm ci --ignore-scripts

      - name: npm audit (avant build)
        run: npm audit --audit-level=high

      - name: Compiler tous les blocs
        run: npm run build

      - name: Créer le ZIP de production
        run: |
          mkdir -p dist/g2rd-theme

          rsync -a \
            --exclude=".git" \
            --exclude=".github" \
            --exclude=".claude" \
            --exclude=".agents" \
            --exclude="node_modules" \
            --exclude="vendor" \
            --exclude="dist" \
            --exclude="docs" \
            --exclude="tools" \
            --exclude="tests" \
            --exclude="phpunit.xml.dist" \
            --exclude=".phpunit.cache" \
            --exclude="blocks/*/src" \
            --exclude="blocks/*/node_modules" \
            --exclude="blocks/*/package.json" \
            --exclude="blocks/*/package-lock.json" \
            --exclude="*.sh" \
            --exclude="*.ps1" \
            --exclude="*.log" \
            --exclude="phpcs*.xml*" \
            --exclude="composer.json" \
            --exclude="composer.lock" \
            --exclude="package.json" \
            --exclude="package-lock.json" \
            --exclude="webpack.config.js" \
            --exclude="skills-lock.json" \
            --exclude=".gitignore" \
            --exclude=".gitattributes" \
            --exclude="CLAUDE.md" \
            . dist/g2rd-theme/

          cd dist
          zip -r g2rd-theme.zip g2rd-theme/
          cd ..

          echo "Taille ZIP : $(du -sh dist/g2rd-theme.zip | cut -f1)"

      - name: Valider le ZIP (intégrité + fichiers requis + exclusions)
        run: bash tools/verify-theme-zip.sh dist/g2rd-theme.zip

      - name: Test installation WordPress (activation du thème depuis le ZIP)
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y default-mysql-client unzip

          ROOT="$(pwd)"
          mkdir -p "$ROOT/_wp-e2e"
          cd "$ROOT/_wp-e2e"

          curl -sSLO https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
          chmod +x wp-cli.phar

          for i in $(seq 1 60); do
            if mysql -h 127.0.0.1 -uroot -proot -e "SELECT 1" >/dev/null 2>&1; then
              echo "MySQL prêt."
              break
            fi
            if [ "$i" -eq 60 ]; then
              echo "ERREUR: MySQL indisponible après attente."
              exit 1
            fi
            sleep 2
          done

          ./wp-cli.phar core download --force
          ./wp-cli.phar config create \
            --dbname=wp_test \
            --dbuser=root \
            --dbpass=root \
            --dbhost=127.0.0.1 \
            --skip-check

          ./wp-cli.phar core install \
            --url=http://example.test \
            --title="G2RD release test" \
            --admin_user=admin \
            --admin_password='AdminPass!2026' \
            --admin_email=admin@example.test \
            --skip-email

          rm -rf wp-content/themes/g2rd-theme
          unzip -q "$ROOT/dist/g2rd-theme.zip" -d wp-content/themes/

          ./wp-cli.phar theme activate g2rd-theme
          ACTIVE="$(./wp-cli.phar theme list --status=active --field=name)"
          echo "Thèmes actifs: $ACTIVE"
          echo "$ACTIVE" | grep -qx g2rd-theme
          echo "OK: thème g2rd-theme activé dans WordPress"

      - name: Créer la release GitHub
        id: github_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "G2RD Theme FSE v${{ steps.version.outputs.version }}"
          files: dist/g2rd-theme.zip
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notifier g2rd.fr de la nouvelle release
        if: success()
        run: |
          DOWNLOAD_URL="${{ steps.github_release.outputs.assets[0].browser_download_url }}"

          if [ -z "$DOWNLOAD_URL" ]; then
            DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.tag }}/g2rd-theme.zip"
          fi

          VERSION="${{ steps.version.outputs.version }}"

          RELEASE_BODY=$(curl -s \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/${{ steps.version.outputs.tag }}" \
            | jq -r '.body // ""')

          PAYLOAD=$(jq -n \
            --arg version "$VERSION" \
            --arg download_url "$DOWNLOAD_URL" \
            --arg changelog "$RELEASE_BODY" \
            '{version: $version, download_url: $download_url, changelog: $changelog}')

          SIGNATURE="sha256=$(echo -n "${PAYLOAD}" | openssl dgst -sha256 -hmac "${{ secrets.G2RD_WEBHOOK_SECRET }}" | awk '{print $2}')"

          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 30 \
            --connect-timeout 10 \
            -X POST \
            -H "Content-Type: application/json" \
            -H "X-G2RD-Signature: ${SIGNATURE}" \
            -d "${PAYLOAD}" \
            "https://g2rd.fr/wp-json/g2rd-license/v1/release-webhook") || HTTP_STATUS="000"

          echo "HTTP Status: ${HTTP_STATUS}"

          if [ "$HTTP_STATUS" != "200" ]; then
            echo "⚠️ Webhook g2rd.fr a retourné HTTP ${HTTP_STATUS} — vérifier manuellement."
            exit 0
          fi

          echo "✅ g2rd.fr notifié de la release v${VERSION} avec changelog"
