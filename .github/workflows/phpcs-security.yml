name: PHPCS WordPress + Security Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  phpcs:
    name: PHPCS WordPress Standards
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          ini-values: "memory_limit=1G"
          coverage: none
          tools: cs2pr, composer

      # Fix erreur allow-plugins : autoriser AVANT l'install
      - name: Autoriser le plugin Composer PHPCS
        run: |
          composer global config allow-plugins.dealerdirect/phpcodesniffer-composer-installer true

      - name: Installer PHPCS + WordPress Standards + Security Audit
        run: |
          composer global require --dev \
            squizlabs/php_codesniffer \
            wp-coding-standards/wpcs \
            phpcompatibility/phpcompatibility-wp \
            phpcsstandards/phpcsextra \
            pheromone/phpcs-security-audit \
            dealerdirect/phpcodesniffer-composer-installer

      - name: Verifier les standards installes
        run: composer global exec -- phpcs -i

      # WordPress Coding Standards — utilise phpcs.xml.dist du projet
      # (standard WordPress + exclusions documentées dans phpcs.xml.dist)
      - name: PHPCS WordPress
        id: phpcs-wp
        continue-on-error: true
        run: |
          composer global exec -- phpcs \
            --standard=phpcs.xml.dist \
            --report-full \
            --report-checkstyle=./phpcs-wp-report.xml \
            --colors \
            -p

      - name: Annotations WordPress
        if: ${{ always() && steps.phpcs-wp.outcome == 'failure' }}
        run: cs2pr ./phpcs-wp-report.xml

      # Security Audit OWASP (SAST) — exclusions dans phpcs-security.xml
      - name: PHPCS Security Audit
        id: phpcs-sec
        continue-on-error: true
        run: |
          composer global exec -- phpcs \
            --standard=phpcs-security.xml \
            --extensions=php \
            --ignore=vendor/*,node_modules/*,blocks/*/build/*,assets/js/vendor/* \
            --report-full \
            --report-checkstyle=./phpcs-security-report.xml \
            --runtime-set ParanoiaMode 0 \
            --colors \
            -p \
            .

      - name: Annotations Security
        if: ${{ always() && steps.phpcs-sec.outcome == 'failure' }}
        run: cs2pr ./phpcs-security-report.xml

      # PHPCompatibility (PHP 8.0+)
      - name: PHPCompatibility
        id: phpcompat
        continue-on-error: true
        run: |
          composer global exec -- phpcs \
            --standard=PHPCompatibilityWP \
            --extensions=php \
            --ignore=vendor/*,node_modules/* \
            --runtime-set testVersion 8.0- \
            --report-full \
            --report-checkstyle=./phpcompat-report.xml \
            --colors \
            -p \
            .

      - name: Annotations PHPCompatibility
        if: ${{ always() && steps.phpcompat.outcome == 'failure' }}
        run: cs2pr ./phpcompat-report.xml

      # Resume dans le summary GitHub
      - name: Resume des resultats
        if: always()
        run: |
          echo "## Resultats PHPCS" >> $GITHUB_STEP_SUMMARY
          echo "- WordPress Standards: ${{ steps.phpcs-wp.outcome }}" >> $GITHUB_STEP_SUMMARY
          echo "- Security Audit: ${{ steps.phpcs-sec.outcome }}" >> $GITHUB_STEP_SUMMARY
          echo "- PHPCompatibility: ${{ steps.phpcompat.outcome }}" >> $GITHUB_STEP_SUMMARY

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phpcs-reports
          path: |
            phpcs-wp-report.xml
            phpcs-security-report.xml
            phpcompat-report.xml
          retention-days: 30
