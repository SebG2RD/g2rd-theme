version: 2

updates:
  # Mises à jour des dépendances npm (racine + workspaces)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    # Regrouper les mises à jour @wordpress/* dans une seule PR
    groups:
      wordpress-packages:
        patterns:
          - "@wordpress/*"
    # Les montées MAJEURES de l'outillage de build ne passent pas par Dependabot.
    # Contexte : le bump auto-mergé @wordpress/scripts 32.6.0 → 33.0.0 a dupliqué
    # webpack (copie imbriquée + copie racine) et cassé le build de tous les
    # workspaces, rouge sur main. Une majeure de la chaîne de build doit être faite
    # manuellement, avec migration et tests. Les patchs/mineures restent automatiques.
    ignore:
      - dependency-name: "@wordpress/scripts"
        update-types: ["version-update:semver-major"]

  # Mises à jour des dépendances Composer (PHP)
  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "weekly"
    # Pas de montée MAJEURE de PHPUnit par Dependabot : chaque majeure relève la
    # version PHP minimale (13 exige PHP 8.4), alors que la CI tourne en PHP 8.2 et
    # que le thème garantit PHP 8.0. La PR #79 (10 → 13) cassait `composer install`
    # en CI. Une majeure se fait à la main, avec la version PHP de la CI et la
    # migration des tests. Les patchs/mineures restent automatiques.
    ignore:
      - dependency-name: "phpunit/phpunit"
        update-types: ["version-update:semver-major"]
